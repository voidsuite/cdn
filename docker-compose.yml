# cdn — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  cdn:
    build:
      context: .
      network: host
    image: ghcr.io/voidsuite/cdn:latest
    container_name: cdn
    restart: unless-stopped
    # Host networking is required on this Docker host (iptables is disabled, so
    # bridge containers cannot reach the internet, including Bunny Storage).
    # The gateway binds to loopback only and nginx proxies the public host.
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: "3011"
      HOST: "127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3011/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
    volumes:
      # SQLite database (+ local fallback blobs) persist across recreates.
      - cdn-data:/app/server/data

volumes:
  cdn-data: